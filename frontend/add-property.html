<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property - Flatery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/add-property.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar Component -->
    <div id="navbar-container" data-component="components/navbar.html"></div>

    <!-- Add Property Form Section -->
    <section class="add-property-section">
        <div class="container">
            <div class="form-header">
                <h1>List Your Property</h1>
                <p>Fill in the details below to list your property</p>
            </div>

            <form id="addPropertyForm" enctype="multipart/form-data">
                
                <!-- Property Basic Details -->
                <div class="form-section">
                    <h2 class="section-title"><i class="fas fa-home"></i> Property Details</h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="propertyType">Property Type <span class="required">*</span></label>
                            <select id="propertyType" name="propertyType" required>
                                <option value="">Select Property Type</option>
                                <option value="PG">PG (Paying Guest)</option>
                                <option value="FLAT">Flat</option>
                                <option value="APARTMENT">Apartment</option>
                            </select>
                        </div>

                        <div class="form-group" id="propertyNameGroup" style="display: none;">
                            <label for="propertyName">Property/Building Name</label>
                            <input type="text" id="propertyName" name="propertyName" placeholder="Enter property name">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group" id="bhkTypeGroup">
                            <label for="bhkType">BHK Type <span class="required">*</span></label>
                            <select id="bhkType" name="bhkType" required>
                                <option value="">Select BHK Type</option>
                                <option value="1">1 BHK</option>
                                <option value="2">2 BHK</option>
                                <option value="3">3 BHK</option>
                                <option value="4">4 BHK</option>
                                <option value="4+">4+ BHK</option>
                            </select>
                        </div>

                        <div class="form-group" id="seaterGroup" style="display: none;">
                            <label for="seater">Seater <span class="required">*</span></label>
                            <select id="seater" name="seater">
                                <option value="">Select Seater</option>
                                <option value="1">1 Seater</option>
                                <option value="2">2 Seater</option>
                                <option value="3">3 Seater</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="currentFloor">Current Floor <span class="required">*</span></label>
                            <input type="number" id="currentFloor" name="currentFloor" min="1" max="100" placeholder="e.g., 5" required>
                        </div>

                        <div class="form-group">
                            <label for="totalFloor">Total Floors <span class="required">*</span></label>
                            <input type="number" id="totalFloor" name="totalFloor" min="1" max="100" placeholder="e.g., 10" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="propertyAge">Property Age <span class="required">*</span></label>
                            <select id="propertyAge" name="propertyAge" required>
                                <option value="">Select Property Age</option>
                                <option value="1-3">1-3 years</option>
                                <option value="3-5">3-5 years</option>
                                <option value="5-10">5-10 years</option>
                                <option value="10+">10+ years</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="facing">Facing <span class="required">*</span></label>
                            <select id="facing" name="facing" required>
                                <option value="">Select Facing</option>
                                <option value="North">North</option>
                                <option value="South">South</option>
                                <option value="East">East</option>
                                <option value="West">West</option>
                                <option value="North-East">North-East</option>
                                <option value="North-West">North-West</option>
                                <option value="South-East">South-East</option>
                                <option value="South-West">South-West</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="builtUpArea">Built-Up Area (sq. ft.) <span class="required">*</span></label>
                            <input type="number" id="builtUpArea" name="builtUpArea" min="1" placeholder="e.g., 1200" required>
                        </div>

                        <div class="form-group">
                            <label for="bathrooms">Bathrooms <span class="required">*</span></label>
                            <div class="number-input">
                                <button type="button" class="decrement" data-target="bathrooms">-</button>
                                <input type="number" id="bathrooms" name="bathrooms" min="1" value="1" required>
                                <button type="button" class="increment" data-target="bathrooms">+</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Property Images -->
                <div class="form-section">
                    <h2 class="section-title"><i class="fas fa-images"></i> Property Images</h2>
                    
                    <div class="form-group">
                        <label for="propertyImages">Upload Property Images <span class="required">*</span></label>
                        <div class="image-upload-container">
                            <input type="file" id="propertyImages" name="propertyImages" accept="image/*" multiple required>
                            <label for="propertyImages" class="file-upload-label">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <span>Click to upload or drag and drop</span>
                                <small>PNG, JPG, JPEG (Max 5MB each, up to 10 images)</small>
                            </label>
                        </div>
                        <div id="imagePreviewContainer" class="image-preview-container"></div>
                    </div>
                </div>

                <!-- Locality Details -->
                <div class="form-section">
                    <h2 class="section-title"><i class="fas fa-map-marker-alt"></i> Locality</h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City <span class="required">*</span></label>
                            <input type="text" id="city" name="city" placeholder="e.g., Mumbai" required>
                        </div>

                        <div class="form-group">
                            <label for="location">Location <span class="required">*</span></label>
                            <input type="text" id="location" name="location" placeholder="e.g., Andheri West" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="landmark">Landmark/Street <span class="required">*</span></label>
                        <input type="text" id="landmark" name="landmark" placeholder="e.g., Near Metro Station" required>
                    </div>
                </div>

                <!-- Rental Details -->
                <div class="form-section">
                    <h2 class="section-title"><i class="fas fa-rupee-sign"></i> Rental Details</h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="expectedRent">Expected Rent (₹/month) <span class="required">*</span></label>
                            <input type="number" id="expectedRent" name="expectedRent" min="0" placeholder="e.g., 15000" required>
                        </div>

                        <div class="form-group">
                            <label for="expectedDeposit">Expected Deposit (₹) <span class="required">*</span></label>
                            <input type="number" id="expectedDeposit" name="expectedDeposit" min="0" placeholder="e.g., 30000" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="rentNegotiable">Rent Negotiable <span class="required">*</span></label>
                            <select id="rentNegotiable" name="rentNegotiable" required>
                                <option value="">Select Option</option>
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="monthlyMaintenance">Monthly Maintenance (₹)</label>
                            <input type="number" id="monthlyMaintenance" name="monthlyMaintenance" min="0" placeholder="e.g., 2000">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="availableFrom">Available From <span class="required">*</span></label>
                            <input type="date" id="availableFrom" name="availableFrom" required>
                        </div>

                        <div class="form-group">
                            <label for="preferredTenant">Preferred Tenant <span class="required">*</span></label>
                            <select id="preferredTenant" name="preferredTenant" required>
                                <option value="">Select Preferred Tenant</option>
                                <option value="Bachelors Male">Bachelors (Male)</option>
                                <option value="Bachelors Female">Bachelors (Female)</option>
                                <option value="Couple">Couple</option>
                                <option value="Family">Family</option>
                                <option value="Married">Married</option>
                                <option value="Anyone">Anyone</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="furnishing">Furnishing <span class="required">*</span></label>
                            <select id="furnishing" name="furnishing" required>
                                <option value="">Select Furnishing</option>
                                <option value="Furnished">Furnished</option>
                                <option value="Semi-Furnished">Semi-Furnished</option>
                                <option value="Unfurnished">Unfurnished</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="parking">Parking <span class="required">*</span></label>
                            <select id="parking" name="parking" required>
                                <option value="">Select Parking</option>
                                <option value="Bike">Bike</option>
                                <option value="Car">Car</option>
                                <option value="Both">Both</option>
                                <option value="None">None</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="propertyDescription">Property Description <span class="required">*</span></label>
                        <textarea id="propertyDescription" name="propertyDescription" rows="5" maxlength="1000" placeholder="Describe your property (max 200 words)" required></textarea>
                        <small class="char-count"><span id="charCount">0</span>/1000 characters</small>
                    </div>
                </div>

                <!-- Amenities -->
                <div class="form-section">
                    <h2 class="section-title"><i class="fas fa-check-circle"></i> Amenities</h2>
                    
                    <div class="amenities-grid">
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="Housekeeping">
                            <span><i class="fas fa-broom"></i> Housekeeping</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="CCTV">
                            <span><i class="fas fa-video"></i> CCTV</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="Kitchen">
                            <span><i class="fas fa-utensils"></i> Kitchen</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="Self Cooking">
                            <span><i class="fas fa-fire"></i> Self Cooking</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="Geyser">
                            <span><i class="fas fa-shower"></i> Geyser</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="Refrigerator">
                            <span><i class="fas fa-temperature-low"></i> Refrigerator</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="24x7 Security">
                            <span><i class="fas fa-shield-alt"></i> 24x7 Security</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="TV">
                            <span><i class="fas fa-tv"></i> TV</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="Power Backup">
                            <span><i class="fas fa-plug"></i> Power Backup</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="Air Conditioning">
                            <span><i class="fas fa-snowflake"></i> Air Conditioning</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="Wi-Fi">
                            <span><i class="fas fa-wifi"></i> Wi-Fi</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="Washing Machine">
                            <span><i class="fas fa-soap"></i> Washing Machine</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="Balcony">
                            <span><i class="fas fa-building"></i> Balcony</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="Gym">
                            <span><i class="fas fa-dumbbell"></i> Gym</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="Swimming Pool">
                            <span><i class="fas fa-swimming-pool"></i> Swimming Pool</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="amenities" value="Lift">
                            <span><i class="fas fa-elevator"></i> Lift</span>
                        </label>
                    </div>
                </div>

                <!-- Property Showing Details -->
                <div class="form-section">
                    <h2 class="section-title"><i class="fas fa-user-check"></i> Property Showing Details</h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="propertyShower">Who will show your property?</label>
                            <select id="propertyShower" name="propertyShower">
                                <option value="">Select Option</option>
                                <option value="Myself">Myself</option>
                                <option value="Neighbour">Neighbour</option>
                                <option value="Tenant">Current Tenant</option>
                                <option value="Friend/Family">Friend/Family</option>
                                <option value="Need Help">Need Help</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="propertyCondition">Current Property Condition</label>
                            <select id="propertyCondition" name="propertyCondition">
                                <option value="">Select Condition</option>
                                <option value="Newly Built">Newly Built</option>
                                <option value="Vacant">Vacant</option>
                                <option value="Tenant on Notice Period">Tenant on Notice Period</option>
                                <option value="Need Help to Manage">Need Help to Manage</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Schedule -->
                <div class="form-section">
                    <h2 class="section-title"><i class="fas fa-calendar-alt"></i> Schedule</h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="availability">Availability <span class="required">*</span></label>
                            <select id="availability" name="availability" required>
                                <option value="">Select Availability</option>
                                <option value="Everyday">Everyday</option>
                                <option value="Weekdays">Weekdays</option>
                                <option value="Weekend">Weekend</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="timeSlot">Time Slot <span class="required">*</span></label>
                            <select id="timeSlot" name="timeSlot" required>
                                <option value="">Select Time Slot</option>
                                <option value="All Day">All Day</option>
                                <option value="Custom">Custom Time</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row" id="customTimeGroup" style="display: none;">
                        <div class="form-group">
                            <label for="startTime">Start Time</label>
                            <input type="time" id="startTime" name="startTime">
                        </div>

                        <div class="form-group">
                            <label for="endTime">End Time</label>
                            <input type="time" id="endTime" name="endTime">
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="window.history.back()">Cancel</button>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-check"></i> Submit Property
                    </button>
                </div>

            </form>
        </div>
    </section>

    <!-- Footer Component -->
    <div id="footer-container" data-component="components/footer.html"></div>

    <!-- Modals Component -->
    <div id="modals-container" data-component="components/modals.html"></div>

    <!-- Scripts -->
    <script src="Javascript/api.js"></script>
    <script src="Javascript/component-loader.js"></script>
    <script src="Javascript/main.js"></script>
    <script>
        // Check authentication before loading the page
        document.addEventListener('DOMContentLoaded', function() {
            // Wait a bit for apiService to be loaded
            setTimeout(function() {
                if (typeof apiService !== 'undefined' && !apiService.isAuthenticated()) {
                    // User is not authenticated, redirect to home page
                    alert('Please login to list your property');
                    window.location.href = 'index.html';
                }
            }, 100);
        });
    </script>
    <script src="Javascript/add-property.js"></script>
</body>
</html>
