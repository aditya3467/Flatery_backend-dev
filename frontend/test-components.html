<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Component Loading</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="Javascript/component-loader.js" defer></script>
    <script src="Javascript/api.js" defer></script>
    <script src="Javascript/main.js" defer></script>
</head>
<body>
    <h1>Testing Component Loading</h1>
    
    <!-- Test navbar component -->
    <div id="navbar-container" data-component="components/navbar.html"></div>
    
    <!-- Test modals component -->
    <div id="modals-container" data-component="components/modals.html"></div>
    
    <p>If the navbar and login buttons work above, the component loading is successful!</p>
    
    <script>
        // Test if components loaded correctly
        setTimeout(() => {
            console.log('Testing component loading...');
            const navbar = document.getElementById('navbar-container');
            const modals = document.getElementById('modals-container');
            
            if (navbar && navbar.innerHTML.trim()) {
                console.log('✅ Navbar component loaded successfully');
            } else {
                console.log('❌ Navbar component failed to load');
            }
            
            if (modals && modals.innerHTML.trim()) {
                console.log('✅ Modals component loaded successfully');
            } else {
                console.log('❌ Modals component failed to load');
            }
            
            // Test login button
            const loginBtn = document.getElementById('mainLoginBtn');
            if (loginBtn) {
                console.log('✅ Login button found');
                loginBtn.click();
                setTimeout(() => {
                    const modal = document.getElementById('loginModal');
                    if (modal && modal.classList.contains('active')) {
                        console.log('✅ Login modal opened successfully');
                        document.getElementById('loginModal').classList.remove('active');
                    } else {
                        console.log('❌ Login modal failed to open');
                    }
                }, 100);
            } else {
                console.log('❌ Login button not found');
            }
        }, 1000);
    </script>
</body>
</html>
