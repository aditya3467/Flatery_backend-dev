<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - Flatery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
    <script src="Javascript/api.js"></script>
</head>
<body>
    <h1>Test Superadmin Login</h1>
    
    <div class="form-group">
        <label>Username:</label>
        <input type="text" id="username" value="superadmin">
    </div>
    
    <div class="form-group">
        <label>Password:</label>
        <input type="password" id="password" value="Admin@123">
    </div>
    
    <button onclick="testLogin()">Test Login</button>
    <button onclick="checkStorage()">Check Storage</button>
    <button onclick="testDashboard()">Test Dashboard</button>
    <button onclick="clearStorage()">Clear Storage</button>
    
    <div id="result"></div>
    
    <script>
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            try {
                resultDiv.style.display = 'block';
                resultDiv.className = 'info';
                resultDiv.innerHTML = 'Logging in...';
                
                const response = await apiService.login({ username, password });
                
                // Store roles
                localStorage.setItem('username', username);
                localStorage.setItem('roles', JSON.stringify(response.roles));
                
                resultDiv.className = 'success';
                resultDiv.innerHTML = `
                    <h3>Login Successful!</h3>
                    <p><strong>Token:</strong> ${response.token.substring(0, 50)}...</p>
                    <p><strong>Roles:</strong> ${JSON.stringify(response.roles)}</p>
                    <p><strong>Token Type:</strong> ${response.tokenType}</p>
                    <p><strong>Expires In:</strong> ${response.expiresIn}</p>
                `;
                
                console.log('Full response:', response);
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    <h3>Login Failed</h3>
                    <p>${error.message}</p>
                `;
                console.error('Login error:', error);
            }
        }
        
        function checkStorage() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'info';
            
            const token = localStorage.getItem('authToken');
            const username = localStorage.getItem('username');
            const roles = localStorage.getItem('roles');
            
            resultDiv.innerHTML = `
                <h3>LocalStorage Contents:</h3>
                <p><strong>Token:</strong> ${token ? token.substring(0, 50) + '...' : 'Not set'}</p>
                <p><strong>Username:</strong> ${username || 'Not set'}</p>
                <p><strong>Roles:</strong> ${roles || 'Not set'}</p>
                <p><strong>Is Authenticated:</strong> ${apiService.isAuthenticated()}</p>
            `;
        }
        
        async function testDashboard() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'info';
            resultDiv.innerHTML = 'Testing dashboard API...';
            
            try {
                const response = await apiService.makeRequest('/stats/users/counts');
                
                resultDiv.className = 'success';
                resultDiv.innerHTML = `
                    <h3>Dashboard API Success!</h3>
                    <p><strong>Owner Count:</strong> ${response.ownerCount}</p>
                    <p><strong>Tenant Count:</strong> ${response.tenantCount}</p>
                `;
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    <h3>Dashboard API Failed</h3>
                    <p>${error.message}</p>
                    <p><strong>Status:</strong> ${error.status || 'Unknown'}</p>
                `;
                console.error('Dashboard error:', error);
            }
        }
        
        function clearStorage() {
            localStorage.clear();
            apiService.clearToken();
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'success';
            resultDiv.innerHTML = '<h3>Storage Cleared!</h3>';
        }
    </script>
</body>
</html>
