<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Dashboard Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Flat Dashboard Debug Tool</h1>
    
    <div class="debug-section">
        <h3>1. Check if right drawer elements exist</h3>
        <div id="drawerCheck"></div>
    </div>
    
    <div class="debug-section">
        <h3>2. Check if tenant table elements exist</h3>
        <div id="tenantTableCheck"></div>
    </div>
    
    <div class="debug-section">
        <h3>3. Test right drawer functionality</h3>
        <button onclick="testDrawer()">Open Test Drawer</button>
        <button onclick="closeDrawer()">Close Drawer</button>
        <div id="drawerTestResult"></div>
    </div>
    
    <div class="debug-section">
        <h3>4. Test tenant data loading</h3>
        <button onclick="testTenantData()">Load Test Tenant Data</button>
        <div id="tenantDataResult"></div>
    </div>

    <!-- Include the actual flat dashboard HTML structure for testing -->
    <div style="display: none;">
        <!-- Right Drawer -->
        <div id="rightDrawer" class="right-drawer">
            <div class="drawer-header">
                <h3 id="drawerTitle">Details</h3>
                <button class="drawer-close" onclick="closeDrawer()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="drawerContent" class="drawer-content">
                <!-- Dynamic content will be loaded here -->
            </div>
        </div>
        
        <div id="rightDrawerOverlay" class="right-drawer-overlay"></div>
        
        <!-- Tenant Table -->
        <table id="tenantsTable">
            <thead>
                <tr>
                    <th>Tenant Name</th>
                    <th>Property</th>
                    <th>Unit</th>
                    <th>Rent</th>
                    <th>Join Date</th>
                    <th>Payment Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tenantsTableBody">
                <!-- Tenant data will be populated here -->
            </tbody>
        </table>
    </div>

    <script>
        // Check if elements exist
        function checkElements() {
            const drawerCheck = document.getElementById('drawerCheck');
            const tenantTableCheck = document.getElementById('tenantTableCheck');
            
            // Check drawer elements
            const rightDrawer = document.getElementById('rightDrawer');
            const overlay = document.getElementById('rightDrawerOverlay');
            const drawerTitle = document.getElementById('drawerTitle');
            const drawerContent = document.getElementById('drawerContent');
            
            let drawerStatus = '';
            if (!rightDrawer) drawerStatus += '<div class="error">❌ rightDrawer not found</div>';
            else drawerStatus += '<div class="success">✅ rightDrawer found</div>';
            
            if (!overlay) drawerStatus += '<div class="error">❌ rightDrawerOverlay not found</div>';
            else drawerStatus += '<div class="success">✅ rightDrawerOverlay found</div>';
            
            if (!drawerTitle) drawerStatus += '<div class="error">❌ drawerTitle not found</div>';
            else drawerStatus += '<div class="success">✅ drawerTitle found</div>';
            
            if (!drawerContent) drawerStatus += '<div class="error">❌ drawerContent not found</div>';
            else drawerStatus += '<div class="success">✅ drawerContent found</div>';
            
            drawerCheck.innerHTML = drawerStatus;
            
            // Check tenant table elements
            const tenantsTable = document.getElementById('tenantsTable');
            const tenantsTableBody = document.getElementById('tenantsTableBody');
            
            let tableStatus = '';
            if (!tenantsTable) tableStatus += '<div class="error">❌ tenantsTable not found</div>';
            else tableStatus += '<div class="success">✅ tenantsTable found</div>';
            
            if (!tenantsTableBody) tableStatus += '<div class="error">❌ tenantsTableBody not found</div>';
            else tableStatus += '<div class="success">✅ tenantsTableBody found</div>';
            
            tenantTableCheck.innerHTML = tableStatus;
        }
        
        // Test drawer functionality
        function testDrawer() {
            const drawer = document.getElementById('rightDrawer');
            const overlay = document.getElementById('rightDrawerOverlay');
            const drawerTitle = document.getElementById('drawerTitle');
            const drawerContent = document.getElementById('drawerContent');
            const result = document.getElementById('drawerTestResult');
            
            if (drawer && overlay && drawerTitle && drawerContent) {
                drawerTitle.textContent = 'Test Drawer';
                drawerContent.innerHTML = '<p>This is a test drawer content!</p>';
                
                drawer.classList.add('active');
                overlay.classList.add('active');
                drawer.style.display = 'flex'; // Make visible for testing
                overlay.style.display = 'block';
                
                result.innerHTML = '<div class="success">✅ Drawer opened successfully!</div>';
            } else {
                result.innerHTML = '<div class="error">❌ Drawer elements missing!</div>';
            }
        }
        
        function closeDrawer() {
            const drawer = document.getElementById('rightDrawer');
            const overlay = document.getElementById('rightDrawerOverlay');
            const result = document.getElementById('drawerTestResult');
            
            if (drawer && overlay) {
                drawer.classList.remove('active');
                overlay.classList.remove('active');
                
                result.innerHTML = '<div class="info">Drawer closed</div>';
            }
        }
        
        // Test tenant data loading
        function testTenantData() {
            const tableBody = document.getElementById('tenantsTableBody');
            const result = document.getElementById('tenantDataResult');
            
            if (!tableBody) {
                result.innerHTML = '<div class="error">❌ tenantsTableBody not found!</div>';
                return;
            }
            
            // Mock tenant data
            const mockTenants = [
                {
                    id: 1,
                    firstName: 'John',
                    lastName: 'Doe',
                    phone: '1234567890',
                    propertyName: 'Test Property',
                    unitNumber: 'A101',
                    rentAmount: 25000,
                    joinDate: '2024-01-01',
                    paymentStatus: 'PAID'
                },
                {
                    id: 2,
                    firstName: 'Jane',
                    lastName: 'Smith',
                    phone: '0987654321',
                    propertyName: 'Another Property',
                    unitNumber: 'B202',
                    rentAmount: 30000,
                    joinDate: '2024-02-01',
                    paymentStatus: 'PENDING'
                }
            ];
            
            // Populate table with mock data
            tableBody.innerHTML = mockTenants.map(tenant => `
                <tr data-tenant-id="${tenant.id}">
                    <td>
                        <div style="font-weight: 500;">${tenant.firstName} ${tenant.lastName || ''}</div>
                        <div style="font-size: 0.8125rem; color: #666;">${tenant.phone || 'N/A'}</div>
                    </td>
                    <td>${tenant.propertyName || 'N/A'}</td>
                    <td>${tenant.unitNumber || 'N/A'}</td>
                    <td>₹${(tenant.rentAmount || 0).toLocaleString()}</td>
                    <td>${tenant.joinDate ? new Date(tenant.joinDate).toLocaleDateString() : 'N/A'}</td>
                    <td>
                        <span class="status-badge ${tenant.paymentStatus?.toLowerCase() || 'pending'}">${tenant.paymentStatus || 'Pending'}</span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-primary tenant-detail-btn" style="padding: 0.25rem 0.5rem; font-size: 0.8125rem;">
                            View Details
                        </button>
                    </td>
                </tr>
            `).join('');
            
            // Make table visible
            const tenantsTable = document.getElementById('tenantsTable');
            tenantsTable.style.display = 'table';
            tenantsTable.style.border = '1px solid #ddd';
            tenantsTable.style.marginTop = '10px';
            
            result.innerHTML = '<div class="success">✅ Mock tenant data loaded successfully!</div>';
        }
        
        // Run checks when page loads
        window.onload = checkElements;
    </script>
</body>
</html>
