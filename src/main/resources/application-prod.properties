# Production configuration for Render deployment
# This file should be used for production environment

# MySQL datasource configuration - uses environment variables from Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.port=${PORT:8080}

# Driver class name
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

# Disable SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production optimizations
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway configuration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration - uses environment variables
flatery.security.jwt.secret-key=${JWT_SECRET_KEY}
flatery.security.jwt.expiration-time=${JWT_EXPIRATION_TIME:36000000}

# Logging - reduce verbosity in production
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.stat=OFF
logging.level.com.Flatery.config.DataInitializer=INFO

# File Upload Configuration
file.upload-dir=${FILE_UPLOAD_DIR:uploads/properties}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.enabled=true

# CORS - Frontend URL (required in production)
cors.allowed.origins=${FRONTEND_URL}
