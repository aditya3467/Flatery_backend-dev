# Default active profile. Change to 'vps' on the VPS (env var `SPRING_PROFILES_ACTIVE=vps`)
spring.profiles.active=local

# Set application timezone to IST to match local system
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata
# Tell Hibernate to use TIMESTAMP WITHOUT TIMEZONE to avoid conversions
spring.jpa.properties.hibernate.type.descriptor.sql.BasicBinder.log_warn_for_noop_bindable_type_conversion=true
# Store LocalDateTime as-is without timezone conversion
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# Driver class name

spring.jpa.hibernate.ddl-auto=update

# spring.jpa.hibernate.ddl-auto=create

# Show SQL queries in the console for debugging
spring.jpa.show-sql=true

# Use MySQL 8 dialect for Hibernate optimizations
# Let Hibernate auto-detect dialect for better compatibility with older MySQL versions
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Format the SQL logs to be more readable (optional)
spring.jpa.properties.hibernate.format_sql=true

# Logging level for SQL binding parameters (optional, can be adjusted)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Recommended: Enable Hibernate statistics for monitoring (optional)
spring.jpa.properties.hibernate.generate_statistics=false
logging.level.com.Flatery.config.DataInitializer=DEBUG
# Recommended: Configure Hibernate to use JDBC batch updates for performance (optional)
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway configuration (safe baseline for existing DB)
# Temporarily disable Flyway because current DB reports as MySQL 5.5 (unsupported by Flyway 9.x)
# Re-enable after upgrading DB to MySQL 5.7+/8.0
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
# Keep default baselineVersion=1 so our first migration uses V2__*.sql
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration


