# MySQL datasource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/flatery_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# Set to empty as the local database has no password
spring.datasource.password=

server.port=8081

# Driver class name
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

# spring.jpa.hibernate.ddl-auto=create

# Show SQL queries in the console for debugging
spring.jpa.show-sql=true

# Use MySQL 8 dialect for Hibernate optimizations
# Let Hibernate auto-detect dialect for better compatibility with older MySQL versions
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Format the SQL logs to be more readable (optional)
spring.jpa.properties.hibernate.format_sql=true

# Logging level for SQL binding parameters (optional, can be adjusted)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Recommended: Enable Hibernate statistics for monitoring (optional)
spring.jpa.properties.hibernate.generate_statistics=true

# Recommended: Configure Hibernate to use JDBC batch updates for performance (optional)
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway configuration (safe baseline for existing DB)
# Temporarily disable Flyway because current DB reports as MySQL 5.5 (unsupported by Flyway 9.x)
# Re-enable after upgrading DB to MySQL 5.7+/8.0
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
# Keep default baselineVersion=1 so our first migration uses V2__*.sql
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration


# IMPORTANT: This is a temporary secret for local development. Generate a new, strong secret for production and load it from an environment variable.
flatery.security.jwt.secret-key=H8/IIvxf9F3Vt7ToAJs13rXZ/7n8ZZwyk9rfnDDn4dzoioqCmbHEqw6hLoUItSzblpSVRHQrZ+HYaEuVAIGgEw==
flatery.security.jwt.expiration-time=36000000
# e.g., 10 hours in milliseconds

# Enable Spring Security debug logging to diagnose authorization decisions (temporary)
logging.level.org.springframework.security=DEBUG

# File Upload Configuration
file.upload-dir=uploads/properties
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.enabled=true
