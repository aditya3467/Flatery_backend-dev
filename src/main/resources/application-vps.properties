# VPS / Production profile

# App Port for VPS
server.port=8081

# MySQL Configuration (VPS) - use provided credentials
spring.datasource.url=jdbc:mysql://localhost:3306/flatery_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=flatery_user
spring.datasource.password=arnar

# Driver class name (optional)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
