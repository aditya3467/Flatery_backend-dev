# Local development profile

# App Port
server.port=8080

# MySQL Configuration (local)
spring.datasource.url=jdbc:mysql://localhost:3306/flatery_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=

# Driver class name (optional since Spring Boot can detect it)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Local frontend is usually served under /frontend by the Spring resource handler
flatery.frontend.base-path=/frontend
flatery.email-verification.base-url=http://localhost:8080
